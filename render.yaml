# Render blueprint. In Render: New → Blueprint → point at this repo.
# This repo's root IS the API, so no rootDir is needed.
# Free tier sleeps after ~15 min idle; the first request then takes ~30s to wake.
services:
  - type: web
    name: reeffocus-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Paste your Neon connection string in the Render dashboard (do not commit it)
      - key: DATABASE_URL
        sync: false

# ── The other environment variables this service needs ───────────────────────
#
# Recorded as comments, not as `envVars` entries, and that is deliberate.
# Declaring them with `sync: false` was tried on 28 Jul 2026 and **broke the
# blueprint sync**: adding new sync-false keys makes Render ask for values, and
# an auto-sync triggered by a push has no way to answer, so the sync fails even
# though the values were already set in the dashboard and the web service
# deployed fine. The list is worth having; paying for it with a red pipeline is
# not.
#
# Set every one of these in Render → Environment. All are verifiable in one
# call: curl -s https://api.reefie.io/api/health
#
#   RESEND_API_KEY             Resend. Without it the server refuses to send in
#                              production rather than pretending to, so account
#                              recovery would silently not exist.
#                              health -> "mail": true
#
#   MAIL_FROM                  The sending address, e.g.
#                              "Reefie <support@reefie.io>". Unset, the code
#                              falls back to Resend's shared onboarding@resend.dev,
#                              which delivers ONLY to the address the Resend
#                              account was registered under — mail that looks
#                              like it works from the one inbox you would test
#                              from. That fallback is a deliberate choice (see
#                              src/mail.ts: fail visibly to the owner rather than
#                              invisibly to everyone), which is exactly why the
#                              real value has to be set.
#                              health -> "mailFrom"
#
#   PUBLIC_BASE_URL            The origin used to build email confirmation links.
#                              Must be the public host, or every confirmation
#                              link points somewhere that does not serve.
#                              health -> "baseUrl"
#
#   REVENUECAT_WEBHOOK_SECRET  Must match the Authorization header value set in
#                              RevenueCat → Integrations → Webhooks *byte for
#                              byte* — the route compares the whole raw header in
#                              constant time and does not strip a "Bearer "
#                              prefix. Until it is set the webhook answers 503
#                              and grants nothing.
#                              health -> "revenuecatWebhook": true
#
#   APPLE_SIGN_IN_READY        Optional, defaults to off. "true" makes
#                              /api/auth/methods advertise Sign in with Apple.
#                              Leave unset for v1.
